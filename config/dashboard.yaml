service: day13-observability-lab
window: 28d

dashboard:
  schema_version: 1
  time_range_minutes: 60
  refresh_seconds: 20
  description: "Day 13 AI Observability Dashboard - 6 SLO panels"

  panels:
    - id: latency
      title: "⏱️ Latency Percentiles"
      source: data/logs.jsonl
      events:
        - response_sent
      fields:
        - latency_ms
      aggregations:
        - p50
        - p95
        - p99
        - median
      query: "event=response_sent"
      unit: ms
      threshold:
        aggregation: p95
        operator: lte
        value: 3000
        slo_target: 99.5

    - id: traffic
      title: "📬 Request Traffic"
      source: data/logs.jsonl
      events:
        - request_received
      fields:
        - event
      aggregations:
        - count
        - rate_per_min
      query: "event=request_received"
      unit: req/min
      threshold:
        aggregation: count
        operator: gte
        value: 1
        slo_target: 99.0

    - id: errors
      title: "🚨 Error Rate"
      source: data/logs.jsonl
      events:
        - request_failed
        - request_received
      fields:
        - event
        - error_type
      aggregations:
        - count
        - error_rate_pct
      query: "event=request_failed"
      unit: "%"
      threshold:
        aggregation: error_rate_pct
        operator: lte
        value: 2.0
        slo_target: 99.0

    - id: cost
      title: "💰 Cost Over Time"
      source: data/logs.jsonl
      events:
        - response_sent
      fields:
        - cost_usd
      aggregations:
        - sum
        - avg
        - total
      query: "event=response_sent"
      unit: USD
      threshold:
        aggregation: sum
        operator: lte
        value: 2.5
        slo_target: 100.0

    - id: tokens
      title: "🔢 Input & Output Tokens"
      source: data/logs.jsonl
      events:
        - response_sent
      fields:
        - tokens_in
        - tokens_out
      aggregations:
        - sum
        - avg
      query: "event=response_sent"
      unit: tokens
      threshold:
        aggregation: sum
        operator: lte
        value: 50000
        slo_target: 95.0

    - id: quality
      title: "⭐ Quality Proxy Score"
      source: data/logs.jsonl
      events:
        - response_sent
      fields:
        - quality_score
      aggregations:
        - mean
        - min
        - max
        - avg
      query: "event=response_sent"
      unit: score
      threshold:
        aggregation: mean
        operator: gte
        value: 0.75
        slo_target: 95.0
